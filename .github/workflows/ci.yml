name: CI Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. ESLint Check
        run: npm run lint

      - name: 2. TypeScript Typecheck
        run: npm run typecheck

      - name: 3. Run Automated Test Suites (GAS + Lead Security)
        run: npm run test

      - name: 4. Verify Database Seeder Integrity
        run: npm run db:seed

      - name: 5. Next.js Production Build
        run: npm run build
