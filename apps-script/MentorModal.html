<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <?!= include('SharedStyles'); ?>
</head>

<body>
  <div class="modal-header">
    <div>
      <h2 class="modal-title">👤 Quản Trị Hồ Sơ Giảng Viên Hàng Loạt</h2>
      <p class="modal-subtitle">Quản trị và bổ sung danh sách giảng viên, mentor hiển thị trên Website DataWithLy</p>
    </div>
  </div>

  <form id="mentorForm">
    <div id="mentorCardsContainer" class="repeater-container"></div>

    <button type="button" id="addMentorBtn" class="btn-add-repeater">
      <span>➕ Thêm giảng viên</span>
    </button>

    <div id="errorBox" class="alert-banner alert-danger error-msg"></div>
    <div id="successBox" class="alert-banner alert-success fade-in" style="display: none;"></div>

    <div class="btn-group">
      <button type="button" class="btn-cancel" onclick="google.script.host.close()">Hủy Bỏ</button>
      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="submitBtnText">Lưu tất cả (1 giảng viên)</span>
      </button>
    </div>
  </form>

  <script>
    var initialMentor = <?!= JSON.stringify(currentMentor || {}) ?>;

    var form = document.getElementById("mentorForm");
    var container = document.getElementById("mentorCardsContainer");
    var addMentorBtn = document.getElementById("addMentorBtn");
    var submitBtn = document.getElementById("submitBtn");
    var submitBtnText = document.getElementById("submitBtnText");
    var errorBox = document.getElementById("errorBox");
    var successBox = document.getElementById("successBox");

    function showError(msg) {
      if (successBox) successBox.style.display = "none";
      errorBox.innerText = msg;
      errorBox.style.display = "block";
    }

    function showSuccess(msg) {
      errorBox.style.display = "none";
      errorBox.innerText = "";
      successBox.innerText = msg;
      successBox.style.display = "flex";
    }

    function updateCardHeaders() {
      var cards = container.querySelectorAll(".form-card");
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var titleElem = card.querySelector(".form-card-title span");
        if (titleElem) {
          titleElem.innerText = "👤 Giảng viên / Mentor #" + (i + 1);
        }
        var removeBtn = card.querySelector(".btn-remove-card");
        if (removeBtn) {
          removeBtn.style.display = cards.length > 1 ? "inline-block" : "none";
        }
      }
      submitBtnText.innerText = "Lưu tất cả (" + cards.length + " giảng viên)";
    }

    function createMentorCard(data) {
      var d = data || {};
      var card = document.createElement("div");
      card.className = "form-card fade-in";
      card.innerHTML =
        '<div class="form-card-header">' +
          '<div class="form-card-title"><span>👤 Giảng viên / Mentor</span></div>' +
          '<button type="button" class="btn-remove-card" title="Xóa thẻ giảng viên này">✕ Xóa</button>' +
        '</div>' +
        '<input type="hidden" name="id" value="' + (d.id || "") + '">' +
        '<div class="preview-box">' +
          '<div class="preview-header">' +
            '<span>Xem trước Card Giảng Viên (Live Card Preview)</span>' +
            '<span class="badge-v badge-emerald">Hiển thị Trang Chủ</span>' +
          '</div>' +
          '<div style="display: flex; gap: 14px; align-items: center;">' +
            '<img class="avatar-preview-img" src="' + (d.avatar_url || "/uploads/mentors/ly-hua.jpg") + '"' +
              ' onerror="this.src=\'https://ui-avatars.com/api/?name=Hua+Thao+Ly&background=8B1D2C&color=fff\'"' +
              ' style="width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary);">' +
            '<div>' +
              '<div class="name-preview-text" style="font-size: 14px; font-weight: 700; color: var(--primary);">' +
                (d.name || "Hứa Thảo Ly") +
              '</div>' +
              '<div class="title-preview-text" style="font-size: 12px; color: var(--slate-muted);">' +
                (d.title || "Lead Mentor & Founder DataWithLy") +
              '</div>' +
              '<div class="companies-preview-text" style="font-size: 11px; margin-top: 2px; font-weight: 500; color: #059669;">' +
                '🏢 ' + (d.companies_worked || "MoMo, Tiki, ACB Bank") +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group col-1">' +
            '<label>Họ và Tên Mentor <span class="required">*</span></label>' +
            '<input type="text" name="name" required value="' + (d.name || "") + '" placeholder="Hứa Thảo Ly">' +
          '</div>' +
          '<div class="form-group col-1">' +
            '<label>Chức Danh & Học Vị <span class="required">*</span></label>' +
            '<input type="text" name="title" required value="' + (d.title || "") + '" placeholder="Lead Mentor & Founder DataWithLy">' +
          '</div>' +
        '</div>' +
        '<div class="form-group">' +
          '<label>Các Công Ty Từng Làm Việc (Phân tách bởi dấu phẩy)</label>' +
          '<input type="text" name="companies_worked" value="' + (d.companies_worked || "") + '" placeholder="MoMo, Tiki, Shopee, ACB Bank">' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group col-1">' +
            '<label>Đường Dẫn Ảnh Đại Diện (Avatar URL)</label>' +
            '<input type="text" name="avatar_url" value="' + (d.avatar_url || "") + '" placeholder="/uploads/mentors/ly-hua.jpg">' +
          '</div>' +
          '<div class="form-group col-1">' +
            '<label>LinkedIn URL</label>' +
            '<input type="text" name="linkedin_url" value="' + (d.linkedin_url || "") + '" placeholder="https://linkedin.com/in/lyhuadata">' +
          '</div>' +
        '</div>' +
        '<div class="form-group">' +
          '<label>Tiểu Sử & Kinh Nghiệm Thực Chiến</label>' +
          '<textarea name="bio" rows="3" placeholder="Hơn 7 năm kinh nghiệm thực chiến trong ngành Dữ liệu tại các tập đoàn công nghệ...">' + (d.bio || "") + '</textarea>' +
        '</div>' +
        '<div class="form-group" style="margin-top: 6px;">' +
          '<label class="checkbox-group">' +
            '<input type="checkbox" name="is_active" ' + (d.is_active !== false ? 'checked' : '') + '>' +
            '<span class="checkbox-label">Kích hoạt hiển thị hồ sơ Mentor trên website (is_active)</span>' +
          '</label>' +
        '</div>';

      var nameInput = card.querySelector('[name="name"]');
      var titleInput = card.querySelector('[name="title"]');
      var companiesInput = card.querySelector('[name="companies_worked"]');
      var avatarInput = card.querySelector('[name="avatar_url"]');

      var namePreview = card.querySelector(".name-preview-text");
      var titlePreview = card.querySelector(".title-preview-text");
      var companiesPreview = card.querySelector(".companies-preview-text");
      var avatarPreview = card.querySelector(".avatar-preview-img");

      nameInput.addEventListener("input", function () {
        namePreview.innerText = this.value || "Chưa nhập họ tên";
      });
      titleInput.addEventListener("input", function () {
        titlePreview.innerText = this.value || "Mentor DataWithLy";
      });
      companiesInput.addEventListener("input", function () {
        companiesPreview.innerText = "🏢 " + (this.value || "Chưa có công ty");
      });
      avatarInput.addEventListener("input", function () {
        if (this.value) avatarPreview.src = this.value;
      });

      var removeBtn = card.querySelector(".btn-remove-card");
      removeBtn.addEventListener("click", function () {
        card.remove();
        updateCardHeaders();
      });

      container.appendChild(card);
      updateCardHeaders();
      return card;
    }

    addMentorBtn.addEventListener("click", function () {
      var newCard = createMentorCard({});
      var input = newCard.querySelector('[name="name"]');
      if (input) input.focus();
    });

    createMentorCard(initialMentor);

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.innerText = "";

      var cards = container.querySelectorAll(".form-card");
      if (cards.length === 0) {
        showError("Vui lòng thêm ít nhất một giảng viên.");
        return;
      }

      var mentorList = [];
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var name = (card.querySelector('[name="name"]').value || "").trim();
        if (!name) {
          showError("Vui lòng nhập họ tên cho giảng viên #" + (i + 1) + ".");
          card.querySelector('[name="name"]').focus();
          return;
        }

        var title = (card.querySelector('[name="title"]').value || "").trim();
        if (!title) {
          showError("Vui lòng nhập chức danh cho giảng viên #" + (i + 1) + ".");
          card.querySelector('[name="title"]').focus();
          return;
        }

        mentorList.push({
          id: card.querySelector('[name="id"]').value || "",
          name: name,
          title: title,
          bio: (card.querySelector('[name="bio"]').value || "").trim(),
          companies_worked: (card.querySelector('[name="companies_worked"]').value || "").trim(),
          avatar_url: (card.querySelector('[name="avatar_url"]').value || "").trim(),
          linkedin_url: (card.querySelector('[name="linkedin_url"]').value || "").trim(),
          is_active: card.querySelector('[name="is_active"]').checked
        });
      }

      submitBtn.disabled = true;
      addMentorBtn.disabled = true;
      submitBtnText.innerHTML = '<span class="spinner"></span> Đang lưu ' + mentorList.length + ' giảng viên...';

      google.script.run
        .withSuccessHandler(function (res) {
          showSuccess("✅ Đã lưu thành công " + (res.count || mentorList.length) + " hồ sơ giảng viên!");
          setTimeout(function () {
            google.script.host.close();
          }, 1200);
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          addMentorBtn.disabled = false;
          updateCardHeaders();
          showError("Lỗi: " + (err.message || err.toString()));
        })
        .addMentorsBatchFromModal(mentorList);
    });
  </script>
</body>

</html>
