<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <?!= include('SharedStyles'); ?>
</head>

<body>
  <div class="modal-header">
    <div>
      <h2 class="modal-title">❓ Thêm Câu Hỏi Thường Gặp (FAQ)</h2>
      <p class="modal-subtitle">Giải đáp thắc mắc phổ biến về học phí, lịch học, đầu ra và lộ trình học tập</p>
    </div>
  </div>

  <form id="faqForm">
    <div class="preview-box">
      <div class="preview-header">
        <span>Xem trước FAQ Accordion</span>
        <span id="previewCategoryBadge" class="badge-v badge-crimson">CHUNG</span>
      </div>
      <div>
        <strong id="previewQuestion" style="font-size: 13px; color: var(--dark-slate);">Người trái ngành, chưa từng học
          IT có theo học được không?</strong>
        <p id="previewAnswer" style="font-size: 12px; color: var(--slate-muted); margin: 6px 0 0; line-height: 1.45;">
          Hoàn toàn được! Lộ trình của DataWithLy được thiết kế đi từ con số 0...
        </p>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group col-1">
        <label for="category">Danh Mục Câu Hỏi <span class="required">*</span></label>
        <select id="category" name="category" required>
          <option value="CHUNG">CHUNG (Thông tin chung & Khóa học)</option>
          <option value="LỊCH HỌC">LỊCH HỌC (Hình thức học & Record)</option>
          <option value="HỌC PHÍ">HỌC PHÍ (Học phí & Chính sách hoàn)</option>
          <option value="ĐẦU RA">ĐẦU RA (Hỗ trợ việc làm & CV)</option>
        </select>
      </div>
      <div class="form-group col-1">
        <label for="sort_order">Thứ Tự Sắp Xếp</label>
        <input type="number" id="sort_order" name="sort_order" value="1" min="1">
      </div>
    </div>

    <div class="form-group">
      <label for="question">Câu Hỏi Thường Gặp <span class="required">*</span></label>
      <input type="text" id="question" name="question" required placeholder="Người trái ngành có học được không?"
        autocomplete="off">
    </div>

    <div class="form-group">
      <label for="answer">Câu Trả Lời Chi Tiết <span class="required">*</span></label>
      <textarea id="answer" name="answer" rows="5" required
        placeholder="Hoàn toàn được! Lộ trình của DataWithLy được thiết kế đi từ con số 0, bắt đầu từ tư duy dữ liệu thực tế và các công cụ dễ tiếp cận trước khi đi vào chuyên sâu."></textarea>
    </div>

    <div class="form-group" style="margin-top: 6px;">
      <label class="checkbox-group">
        <input type="checkbox" id="is_active" name="is_active" checked>
        <span class="checkbox-label">Kích hoạt hiển thị trên website (is_active)</span>
      </label>
    </div>

    <div id="errorBox" class="alert-banner alert-danger error-msg"></div>

    <div class="btn-group">
      <button type="button" class="btn-cancel" onclick="google.script.host.close()">Hủy Bỏ</button>
      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Lưu Câu Hỏi</span>
      </button>
    </div>
  </form>

  <script>
    var catSelect = document.getElementById("category");
    var qInput = document.getElementById("question");
    var aInput = document.getElementById("answer");

    var catBadge = document.getElementById("previewCategoryBadge");
    var qPreview = document.getElementById("previewQuestion");
    var aPreview = document.getElementById("previewAnswer");

    function updatePreview() {
      catBadge.innerText = catSelect.value;
      qPreview.innerText = qInput.value || "Câu hỏi thường gặp...";
      aPreview.innerText = aInput.value || "Câu trả lời chi tiết...";
    }

    catSelect.addEventListener("change", updatePreview);
    qInput.addEventListener("input", updatePreview);
    aInput.addEventListener("input", updatePreview);

    var form = document.getElementById("faqForm");
    var submitBtn = document.getElementById("submitBtn");
    var errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.innerText = "";

      var q = qInput.value.trim();
      var a = aInput.value.trim();
      if (!q || !a) {
        showError("Vui lòng nhập cả câu hỏi và câu trả lời.");
        return;
      }

      var data = {
        category: catSelect.value,
        question: q,
        answer: a,
        is_active: document.getElementById("is_active").checked,
        sort_order: parseInt(document.getElementById("sort_order").value, 10) || 1
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Đang lưu...';

      google.script.run
        .withSuccessHandler(function () {
          google.script.host.close();
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Lưu Câu Hỏi</span>';
          showError("Lỗi: " + (err.message || err.toString()));
        })
        .saveFaqFromModal(data);
    });

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.style.display = "block";
    }
  </script>
</body>

</html>
