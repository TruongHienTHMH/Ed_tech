<style>
  :root {
    --primary: #8B1D2C;
    --primary-hover: #701622;
    --primary-subtle: rgba(139, 29, 44, 0.08);
    --primary-border: #F0D5D8;
    --dark-slate: #1F242F;
    --slate-muted: #4B5563;
    --slate-light: #9CA3AF;
    --bg-canvas: #FAF9F6;
    --bg-card: #FFFFFF;
    --border-color: #E5E7EB;
    --border-focus: #8B1D2C;
    --success: #059669;
    --success-bg: #ECFDF5;
    --warning: #D97706;
    --warning-bg: #FFFBEB;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 18px 20px 24px;
    margin: 0;
    background: var(--bg-canvas);
    color: var(--dark-slate);
    font-size: 13px;
    line-height: 1.5;
  }

  .modal-header {
    border-bottom: 2px solid var(--primary-border);
    padding-bottom: 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title {
    margin: 0;
    color: var(--primary);
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.01em;
  }

  .modal-subtitle {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--slate-muted);
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .form-row .form-group {
    margin-bottom: 0;
    flex: 1;
  }

  .col-1 {
    flex: 1;
  }

  .col-2 {
    flex: 2;
  }

  .col-3 {
    flex: 3;
  }

  .col-full {
    width: 100%;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #374151;
  }

  label .required {
    color: var(--danger);
    margin-left: 2px;
  }

  .help-text {
    font-size: 11px;
    color: var(--slate-muted);
    margin-top: 3px;
    line-height: 1.35;
  }

  input[type="text"],
  input[type="number"],
  input[type="url"],
  input[type="date"],
  input[type="datetime-local"],
  select,
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg-card);
    color: var(--dark-slate);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(139, 29, 44, 0.15);
  }

  input[readonly],
  textarea[readonly] {
    background-color: #F3F4F6;
    color: var(--slate-muted);
    cursor: not-allowed;
  }

  textarea {
    resize: vertical;
    min-height: 64px;
  }

  /* Checkbox & Switch */
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
  }

  .checkbox-group:hover {
    border-color: #D1D5DB;
  }

  .checkbox-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
    margin: 0;
  }

  .checkbox-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--dark-slate);
    cursor: pointer;
  }

  /* Live Preview Box */
  .preview-box {
    background: #FFFFFF;
    border: 1px dashed var(--primary-border);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--primary);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .preview-content {
    font-size: 12px;
    color: var(--dark-slate);
  }

  /* Badges */
  .badge-v {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
  }

  .badge-crimson {
    background: var(--primary-subtle);
    color: var(--primary);
    border: 1px solid var(--primary-border);
  }

  .badge-emerald {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #A7F3D0;
  }

  .badge-gold {
    background: var(--warning-bg);
    color: var(--warning);
    border: 1px solid #FDE68A;
  }

  .badge-slate {
    background: #F3F4F6;
    color: var(--dark-slate);
    border: 1px solid #E5E7EB;
  }

  /* Action Buttons */
  .btn-group {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border-color);
  }

  button {
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-submit {
    background: var(--primary);
    color: #FFFFFF;
    border: 1px solid var(--primary-hover);
    box-shadow: 0 1px 2px rgba(139, 29, 44, 0.2);
  }

  .btn-submit:hover:not(:disabled) {
    background: var(--primary-hover);
    box-shadow: 0 2px 4px rgba(139, 29, 44, 0.3);
  }

  .btn-submit:disabled {
    background: #9CA3AF;
    border-color: #9CA3AF;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .btn-secondary {
    background: #FFFFFF;
    color: var(--primary);
    border: 1px solid var(--primary);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--primary-subtle);
    border-color: var(--primary-hover);
    color: var(--primary-hover);
  }

  .btn-secondary:disabled {
    background: #F3F4F6;
    border-color: #E5E7EB;
    color: #9CA3AF;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .btn-secondary .spinner {
    border-color: rgba(139, 29, 44, 0.2);
    border-top-color: var(--primary);
  }

  .btn-cancel {
    background: #FFFFFF;
    color: var(--dark-slate);
    border: 1px solid var(--border-color);
  }

  .btn-cancel:hover {
    background: #F9FAFB;
    border-color: #D1D5DB;
  }

  /* Alert Messages */
  .error-msg {
    color: var(--danger);
    font-size: 11px;
    margin-top: 4px;
    display: none;
    font-weight: 500;
  }

  .alert-banner {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .alert-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #FECACA;
  }

  .alert-success {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #A7F3D0;
  }

  .alert-info {
    background: #EFF6FF;
    color: #1D4ED8;
    border: 1px solid #BFDBFE;
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #FFFFFF;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Fade in */
  .fade-in {
    animation: fadeIn 0.2s ease-in-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
