<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <?!= include('SharedStyles'); ?>
</head>

<body>
  <div class="modal-header">
    <div>
      <h2 class="modal-title">✍️ Thêm Bài Viết Blog</h2>
      <p class="modal-subtitle">Xuất bản bài viết kiến thức, tự động sinh slug chuẩn SEO và chống trùng lặp</p>
    </div>
  </div>

  <form id="blogForm">
    <div class="form-group">
      <label for="title">Tiêu Đề Bài Viết <span class="required">*</span></label>
      <input type="text" id="title" name="title" required
        placeholder="Lộ trình chuyển ngành Data Analytics từ con số 0 năm 2026" autocomplete="off">
    </div>

    <div class="preview-box">
      <div class="preview-header">
        <span>Xem trước URL Bài Viết Blog</span>
        <span id="versionBadge" class="badge-v badge-emerald">Chuẩn SEO</span>
      </div>
      <div class="preview-content">
        https://datawithly.edu.vn/blog/<strong id="slugPreview"
          style="color: var(--primary);">lo-trinh-chuyen-nganh-data-analytics</strong>
      </div>
      <input type="hidden" id="slug" name="slug">
      <input type="hidden" id="blog_id" name="id">
    </div>

    <div class="form-row">
      <div class="form-group col-1">
        <label for="category">Chuyên Mục Bài Viết <span class="required">*</span></label>
        <select id="category" name="category">
          <option value="Sự nghiệp">Sự nghiệp (Career Path)</option>
          <option value="Kỹ thuật">Kỹ thuật (SQL / BI / Python)</option>
          <option value="Case Study">Case Study Thực Chiến</option>
          <option value="Góc nhìn">Góc nhìn & Tư duy Dữ liệu</option>
        </select>
      </div>
      <div class="form-group col-1">
        <label for="author_name">Tác Giả <span class="required">*</span></label>
        <input type="text" id="author_name" name="author_name" required value="Hứa Thảo Ly" placeholder="Hứa Thảo Ly">
      </div>
    </div>

    <div class="form-group">
      <label for="excerpt">Đoạn Tóm Tắt Ngắn (Meta Description & Excerpt) <span class="required">*</span></label>
      <textarea id="excerpt" name="excerpt" rows="3" required
        placeholder="Chi tiết từng giai đoạn học tập, kỹ năng cần chuẩn bị và cách xây dựng Portfolio để chinh phục nhà tuyển dụng trong 6 tháng..."></textarea>
    </div>

    <div class="form-row" style="margin-top: 6px;">
      <div class="form-group col-1">
        <label for="published_at">Ngày Xuất Bản</label>
        <input type="date" id="published_at" name="published_at">
      </div>
      <div class="form-group col-1" style="display: flex; align-items: flex-end;">
        <label class="checkbox-group" style="width: 100%;">
          <input type="checkbox" id="is_active" name="is_active" checked>
          <span class="checkbox-label">Xuất bản công khai (is_active)</span>
        </label>
      </div>
    </div>

    <div id="errorBox" class="alert-banner alert-danger error-msg"></div>

    <div class="btn-group">
      <button type="button" class="btn-cancel" onclick="google.script.host.close()">Hủy Bỏ</button>
      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Xuất Bản Bài Viết</span>
      </button>
    </div>
  </form>

  <script>
    var existingSlugs = <?!= JSON.stringify(existingSlugs || []) ?>;

    function slugify(text) {
      if (!text) return "";
      var str = text.toString().toLowerCase().trim();
      str = str.replace(/[áàảãạăắằẳẵặâấầẩẫậ]/g, "a");
      str = str.replace(/[éèẻẽẹêếềểễệ]/g, "e");
      str = str.replace(/[íìỉĩị]/g, "i");
      str = str.replace(/[óòỏõọôốồổỗộơớờởỡợ]/g, "o");
      str = str.replace(/[úùủũụưứừửữự]/g, "u");
      str = str.replace(/[ýỳỷỹỵ]/g, "y");
      str = str.replace(/đ/g, "d");
      str = str.replace(/[\s_]+/g, "-");
      str = str.replace(/[^a-z0-9-]/g, "");
      str = str.replace(/-+/g, "-");
      str = str.replace(/^-+|-+$/g, "");
      return str;
    }

    function resolveUniqueSlugClient(rawInput, existingSlugs, currentSlug) {
      var base = slugify(rawInput);
      if (!base) return { slug: "", isVersioned: false };

      var cleanBase = base.replace(/-v\d+$/, "");
      var slugMap = {};
      var list = existingSlugs || [];
      var cur = (currentSlug || "").toString().trim().toLowerCase();

      for (var i = 0; i < list.length; i++) {
        var s = (list[i] || "").toString().trim().toLowerCase();
        if (s && s !== cur) {
          slugMap[s] = true;
        }
      }

      if (!slugMap[cleanBase]) {
        return { slug: cleanBase, isVersioned: false };
      }

      var version = 1;
      while (true) {
        var candidate = cleanBase + "-v" + version;
        if (!slugMap[candidate]) {
          return { slug: candidate, isVersioned: true };
        }
        version++;
      }
    }

    var titleInput = document.getElementById("title");
    var slugPreview = document.getElementById("slugPreview");
    var slugHidden = document.getElementById("slug");
    var idHidden = document.getElementById("blog_id");
    var versionBadge = document.getElementById("versionBadge");

    titleInput.addEventListener("input", function () {
      var rawSlug = slugify(this.value);
      if (!rawSlug) {
        slugPreview.innerText = "lo-trinh-chuyen-nganh-data-analytics";
        slugHidden.value = "";
        idHidden.value = "";
        versionBadge.className = "badge-v badge-slate";
        versionBadge.innerText = "Chờ nhập liệu";
        return;
      }

      var res = resolveUniqueSlugClient(rawSlug, existingSlugs);
      slugPreview.innerText = res.slug;
      slugHidden.value = res.slug;
      idHidden.value = "blg-" + res.slug;

      if (res.isVersioned) {
        versionBadge.className = "badge-v badge-crimson";
        versionBadge.innerText = "⚡ Trùng tiêu đề -> Đã gắn: " + res.slug.split("-").pop();
      } else {
        versionBadge.className = "badge-v badge-emerald";
        versionBadge.innerText = "✅ Duy nhất chuẩn SEO";
      }
    });

    document.getElementById("published_at").value = new Date().toISOString().split("T")[0];

    var form = document.getElementById("blogForm");
    var submitBtn = document.getElementById("submitBtn");
    var errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.innerText = "";

      var title = titleInput.value.trim();
      var excerpt = document.getElementById("excerpt").value.trim();
      if (!title || !excerpt) {
        showError("Vui lòng nhập tiêu đề bài viết và đoạn tóm tắt.");
        return;
      }

      var data = {
        id: idHidden.value || ("blg-" + slugify(title)),
        title: title,
        slug: slugHidden.value || slugify(title),
        category: document.getElementById("category").value,
        excerpt: excerpt,
        author_name: document.getElementById("author_name").value.trim() || "Hứa Thảo Ly",
        published_at: document.getElementById("published_at").value,
        is_active: document.getElementById("is_active").checked
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Đang lưu...';

      google.script.run
        .withSuccessHandler(function () {
          google.script.host.close();
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Xuất Bản Bài Viết</span>';
          showError("Lỗi: " + (err.message || err.toString()));
        })
        .saveBlogFromModal(data);
    });

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.style.display = "block";
    }
  </script>
</body>

</html>
