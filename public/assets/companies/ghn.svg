<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 38" fill="none">
  <!-- GHN Fast Truck Icon -->
  <g transform="translate(2, 6)">
    <!-- Speed streaks -->
    <path d="M0 6 L8 6 M2 12 L7 12 M0 18 L6 18" stroke="#F37021" stroke-width="2" stroke-linecap="round"/>
    <!-- Truck Cab and Trailer -->
    <path d="M10 4 L22 4 L22 22 L10 22 Z" fill="#F37021"/>
    <path d="M22 10 L28 10 L32 15 L32 22 L22 22 Z" fill="#F37021"/>
    <!-- Wheels -->
    <circle cx="14" cy="23" r="3" fill="#1F242F" stroke="white" stroke-width="1.5"/>
    <circle cx="28" cy="23" r="3" fill="#1F242F" stroke="white" stroke-width="1.5"/>
  </g>
  <!-- Wordmark GHN -->
  <text x="40" y="26" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1">GHN</text>
  <text x="96" y="25" fill="#F37021" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">EXPRESS</text>
</svg>
